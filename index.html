<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi & Presensi Seminar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .frame-container {
      width: 100vw;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <iframe
      src="https://script.google.com/macros/s/AKfycbzSWzKkl_WQEAuEhbYUSyYx251CjDag1ZXTGI5hXuWUoMzve4kge-2Y5BgIMFBgaOHF/exec"
      title="Aplikasi Registrasi dan Presensi Seminar"
      allow="camera; microphone; clipboard-read; clipboard-write"
      allowfullscreen
      loading="eager"
    ></iframe>
  </div>
</body>
</html>
