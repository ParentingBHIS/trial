<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parenting Buahati - Scanner Kehadiran</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Open Sans', sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    .scanner-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .scanner-card {
      width: 100%;
      max-width: 600px;
      padding: 2rem;
      background-color: rgba(30, 30, 40, 0.92);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(167, 243, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      border-bottom: 3px solid #A7F300;
      padding-bottom: 10px;
    }

    #qr-reader {
      width: 100%;
      min-height: 260px;
      background: #ffffff;
      color: #121212;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .form-select-camera {
      background-color: #252532;
      color: #ffffff;
      border: 1px solid #495057;
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 0.75rem;
    }

    .form-select-camera:focus {
      background-color: #252532;
      color: #ffffff;
      border-color: #A7F300;
      box-shadow: 0 0 0 0.2rem rgba(167, 243, 0, 0.25);
    }

    .btn-custom {
      background-color: #A7F300;
      color: #1a1a1a;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      transition: 0.3s;
    }

    .btn-custom:hover {
      background-color: #8AD400;
    }

    .btn-secondary-custom {
      background-color: #495057;
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <div class="scanner-section">
    <div class="scanner-card">
      <h2>Scanner Kehadiran</h2>
      <div id="qr-reader"></div>

      <select id="camera-select" class="form-select form-select-camera" aria-label="Pilih kamera">
        <option value="">Memuat daftar kamera...</option>
      </select>

      <div class="text-center mt-2 d-flex gap-2 justify-content-center flex-wrap">
        <button id="btn-switch-camera" type="button" class="btn btn-custom">
          <span class="material-icons align-middle" style="font-size: 1.2rem;">switch_camera</span>
          Ganti Kamera
        </button>
        <button id="btn-back" type="button" class="btn btn-secondary-custom">
          Kembali ke Admin
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // ========================================================
    const ADMIN_URL = "https://parentingbhis.github.io/seminar/";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzXBu0H9mhKvpIQV65WB1IbstzYz8j0d0p8xy7xJ0W4iCwvMNgH9myxsYFZt8qcRZc0/exec";
    // ========================================================

    let html5QrCode;
    let cameras = [];
    let currentCameraIndex = 0;
    let isProcessing = false;

    document.addEventListener("DOMContentLoaded", async () => {
      html5QrCode = new Html5Qrcode("qr-reader");

      document.getElementById("camera-select").addEventListener("change", async (event) => {
        const idx = parseInt(event.target.value, 10);
        if (!Number.isNaN(idx) && cameras[idx]) {
          currentCameraIndex = idx;
          await restartScannerWithCamera(cameras[currentCameraIndex].id);
        }
      });

      document.getElementById("btn-switch-camera").addEventListener("click", switchCamera);
      document.getElementById("btn-back").addEventListener("click", () => {
        window.location.href = ADMIN_URL;
      });

      await initCamerasAndStart();
    });

    function populateCameraDropdown() {
      const selectEl = document.getElementById("camera-select");
      selectEl.innerHTML = "";

      cameras.forEach((cam, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.textContent = cam.label || `Kamera ${idx + 1}`;
        if (idx === currentCameraIndex) {
          option.selected = true;
        }
        selectEl.appendChild(option);
      });
    }

    async function initCamerasAndStart() {
      const selectEl = document.getElementById("camera-select");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        selectEl.innerHTML = '<option value="">Browser tidak mendukung kamera</option>';
        Swal.fire({
          icon: "error",
          title: "Kamera Tidak Didukung",
          text: "Browser atau koneksi ini tidak mendukung akses kamera."
        });
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach((track) => track.stop());

        cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          selectEl.innerHTML = '<option value="">Tidak ada kamera terdeteksi</option>';
          Swal.fire({
            icon: "error",
            title: "Kamera Tidak Ditemukan",
            text: "Tidak ada perangkat kamera yang tersedia pada perangkat ini."
          });
          return;
        }

        const backIndex = cameras.findIndex((cam) => /back|rear|environment/i.test(cam.label));
        currentCameraIndex = backIndex >= 0 ? backIndex : 0;

        populateCameraDropdown();
        await startScannerByDeviceId(cameras[currentCameraIndex].id);
      } catch (err) {
        selectEl.innerHTML = '<option value="">Izin kamera ditolak / gagal</option>';
        Swal.fire({
          icon: "error",
          title: "Izin Kamera Ditolak",
          text: "Klik ikon izin/pengaturan di bilah alamat browser, ubah Camera ke Allow, lalu muat ulang halaman."
        });
      }
    }

    async function startScannerByDeviceId(deviceId) {
      try {
        await html5QrCode.start(
          deviceId,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess
        );
      } catch (err) {
        Swal.fire({
          icon: "error",
          title: "Kamera Error",
          text: "Tidak dapat memulai kamera. Pastikan kamera tidak sedang dipakai aplikasi lain."
        });
      }
    }

    async function restartScannerWithCamera(deviceId) {
      if (!html5QrCode) return;
      if (html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      await startScannerByDeviceId(deviceId);
    }

    async function startScanner() {
      if (!cameras.length) {
        await initCamerasAndStart();
        return;
      }
      const activeCam = cameras[currentCameraIndex] || cameras[0];
      await startScannerByDeviceId(activeCam.id);
    }

    async function switchCamera() {
      if (!cameras.length) {
        await initCamerasAndStart();
        return;
      }
      if (cameras.length === 1) {
        Swal.fire({
          icon: "info",
          title: "Hanya 1 Kamera",
          text: "Perangkat ini hanya memiliki satu kamera."
        });
        return;
      }
      currentCameraIndex = (currentCameraIndex + 1) % cameras.length;
      document.getElementById("camera-select").value = currentCameraIndex;
      await restartScannerWithCamera(cameras[currentCameraIndex].id);
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }

      Swal.fire({
        title: "Memproses...",
        text: "Mencatat kehadiran...",
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const endpoint = new URL(GAS_API_URL);
        endpoint.searchParams.set("action", "checkin");
        endpoint.searchParams.set("phone", decodedText);

        const response = await fetch(endpoint.toString());
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const result = await response.json();

        const toast = Swal.mixin({
          toast: true,
          position: "top-end",
          showConfirmButton: false,
          timer: 3500,
          timerProgressBar: true
        });

        if (result.status === "SUCCESS") {
          toast.fire({ icon: "success", title: `Check-in: ${result.name}` });
        } else if (result.status === "INFO") {
          toast.fire({ icon: "info", title: `${result.name} sudah check-in!` });
        } else if (result.status === "GAGAL") {
          toast.fire({ icon: "error", title: `Gagal: ${result.message}` });
        } else {
          toast.fire({ icon: "error", title: `Error: ${result.message || "Respons tidak dikenal"}` });
        }
      } catch (error) {
        Swal.fire({
          icon: "error",
          title: "Koneksi Gagal",
          text: "Tidak dapat terhubung ke server Apps Script."
        });
      } finally {
        setTimeout(() => {
          isProcessing = false;
          startScanner();
        }, 2000);
      }
    }
  </script>
</body>
</html>
